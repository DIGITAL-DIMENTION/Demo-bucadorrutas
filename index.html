<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RutaChida · ¿Qué combi me lleva?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head><body><div class="wrap">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="4"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8.5" cy="14.5" r=".8"/><circle cx="15.5" cy="14.5" r=".8"/></symbol>
<symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2-6-2-3 2-5 3 3 3 1M13 10l-1 5 3 2 1 4"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.3 7-12a7 7 0 10-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.6-1-3.5-1.2-4 .3-.5 1.6 4.4 1 4 3-.4 1.8-3.4 1.6-4.5.2M12 6.5V8M12 16v1.5"/></symbol>
</defs></svg>
<header>
 <div class="logo"><i><svg class="ic" style="color:#fff"><use href="#i-bus"/></svg></i>RutaChida</div>
 <div class="price"><svg class="ic" style="width:16px;height:16px"><use href="#i-coin"/></svg>Solo $5 MXN</div>
</header>
<section class="hero">
 <h1>¿Qué combi me lleva?</h1>
 <p>Dinos dónde estás y a dónde vas. Te decimos qué ruta tomar, dónde subirte y cuánto caminas.</p>
 <div class="form">
  <div class="fld"><label for="o">ESTOY EN</label><input id="o" autocomplete="off" placeholder="Escribe: centro, mercado…"><div class="sug" id="so"></div></div>
  <button class="ghost" id="sw" title="Invertir"><svg class="ic"><use href="#i-swap"/></svg></button>
  <div class="fld"><label for="d">QUIERO LLEGAR A</label><input id="d" autocomplete="off" placeholder="Escribe: Tuxco, crucero…"><div class="sug" id="sd"></div></div>
  <button class="go" id="go">Buscar ruta</button>
 </div>
 <div class="tools"><button class="loc" id="gps"><svg class="ic" style="width:16px;height:16px"><use href="#i-pin"/></svg>Usar mi ubicación actual</button>
 <label class="loc" for="gpxf">+ Agregar ruta desde GPX</label><input type="file" id="gpxf" accept=".gpx" hidden></div>
</section>
<div class="grid"><div id="res"></div><div class="mapbox"><div id="map"></div></div></div>
<p class="note">Toca el mapa para marcar tu origen o destino. Ruta real grabada con GeoTracker.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/routes.js"></script>
<script src="js/geo.js"></script>
<script src="js/engine.js"></script>
<script src="js/map.js"></script>
<script src="js/gpx.js"></script>
<script src="js/ui.js"></script>
</body></html>
